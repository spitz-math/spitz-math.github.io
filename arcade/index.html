<style>
/* Arcade hub, neon look to match the spitzmath.com launch pad (same night sky, scanlines, floor grid, Bungee + Press Start 2P).
   Pick a game (new and updated games get a bigger row up top), and its sheet opens: game art on the left, question sets on the
   right (Mr. Spitz's suggested sets once, in gold, then the rest as a plain list), PRESS START always in view. 2026-11-05 cleanup:
   only the game cards and the sheet are framed, glows mark state only, nothing pulses, corner sizes are --r-s / --r-l / 999px. */
:root{
  color-scheme:dark;
  --bg:#06081a; --bg2:#02030c; --panel:rgba(8,11,36,.86); --panel2:#11163f; --line:#262d66;
  --fg:#eaf6ff; --dim:rgba(234,246,255,.62);
  --pink:#ff2bd6; --cyan:#21e6ff; --yellow:#ffe13a; --orange:#ff7a1a;
  --ms:3600ms;
  --r-s:6px; --r-l:14px;
  --s2:8px; --s3:12px; --s4:24px; --s5:32px;
  --display:'Bungee',Impact,sans-serif; --pixel:'Press Start 2P',monospace; --body:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);font:600 16px/1.45 var(--body);min-height:100vh;position:relative;overflow-x:hidden;
  background:linear-gradient(180deg,#0a0f33 0%,var(--bg) 40%,var(--bg2) 100%) fixed var(--bg);
  padding:0 max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.03) 0 1px,transparent 1px 4px),radial-gradient(ellipse at 50% 120%,rgba(33,230,255,.14),transparent 55%)}
.bgfx::after{content:"";position:absolute;left:-20%;right:-20%;bottom:0;height:34%;opacity:.55;
  background:repeating-linear-gradient(90deg,rgba(255,43,214,.28) 0 2px,transparent 2px 70px),repeating-linear-gradient(180deg,rgba(33,230,255,.28) 0 2px,transparent 2px 46px);
  transform:perspective(500px) rotateX(62deg);transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 60%);mask-image:linear-gradient(180deg,transparent,#000 60%)}
.star{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.5;pointer-events:none;z-index:0;animation:twinkle 2.6s ease-in-out infinite}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s5)}

/* header: back link, burger + title, leaderboard */
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-top:18px}
.home{justify-self:start;font-family:var(--pixel);font-size:10px;letter-spacing:.08em;color:var(--cyan);text-decoration:none;text-transform:uppercase;padding:10px 12px;border:2px solid transparent;border-radius:var(--r-s)}
.home:hover,.home:focus-visible{border-color:var(--cyan);outline:none}
.brand{display:flex;align-items:center;gap:14px}
/* burger + starburst, same motion as the launch pad (slow bob, burst breathing, halo glow) */
.logo{position:relative;flex:none;width:clamp(70px,8.4vw,104px);aspect-ratio:1312/1199}
.logo img{position:absolute;inset:0;width:100%;height:100%;display:block;will-change:transform}
.logo .burst{animation:burst calc(var(--ms)*1.25) ease-in-out infinite;filter:drop-shadow(0 0 3px #fff7b0) drop-shadow(0 0 8px var(--yellow)) drop-shadow(0 0 16px rgba(255,122,26,.7))}
.logo .patty{animation:bob var(--ms) ease-in-out infinite;animation-delay:-700ms;transform-origin:50% 60%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}
.logo .halo{position:absolute;inset:4%;border-radius:50%;background:radial-gradient(circle,var(--yellow) 0%,var(--orange) 30%,transparent 65%);opacity:.22;filter:blur(12px);animation:halo var(--ms) ease-in-out infinite}
h1{font-family:var(--display);font-weight:400;margin:0;line-height:1;text-align:center;white-space:nowrap;
  font-size:clamp(30px,5.2vw,62px);letter-spacing:.05em;text-transform:uppercase;padding:.04em .1em;
  background:linear-gradient(180deg,#fff27a 0%,var(--yellow) 22%,#ff9d14 50%,var(--orange) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  -webkit-text-stroke:.07em #140800;paint-order:stroke fill;
  filter:drop-shadow(.05em .06em 0 #140800) drop-shadow(0 0 3px #fff7b0) drop-shadow(0 0 12px #ffb21f) drop-shadow(0 0 26px rgba(255,122,26,.75));animation:sway var(--ms) ease-in-out infinite;will-change:transform}
.sub{margin:8px 0 0;text-align:center;font:400 clamp(8px,.9vw,11px)/1.4 var(--pixel);letter-spacing:.14em;text-transform:uppercase;color:var(--pink);text-shadow:0 0 8px var(--pink)}
.lb{justify-self:end;--c:var(--cyan);display:inline-flex;align-items:center;gap:10px;font-family:var(--pixel);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#fff;text-decoration:none;
  padding:12px 16px;border-radius:var(--r-s);border:2px solid var(--c);background:rgba(4,6,28,.72);transition:transform .18s ease-out,box-shadow .18s}
.lb span{font-size:18px}
.lb:hover,.lb:focus-visible{transform:translateY(-2px);box-shadow:0 0 14px color-mix(in srgb,var(--c) 60%,transparent);outline:none}

/* section labels: small pixel eyebrows, so the page title and the game names stay the loudest things */
.lab2{display:flex;align-items:baseline;gap:12px;margin:0 0 var(--s3);font:400 11px/1.4 var(--pixel);letter-spacing:.1em;text-transform:uppercase;color:var(--pink)}
.lab2 small{font:700 14px/1.3 var(--body);letter-spacing:0;text-transform:none;color:var(--dim)}
#all .lab2{color:var(--cyan)}

/* game cards: the only framed things on the page, because they're what you pick */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:var(--s3)}
.games.feat{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--s4)}
.game{all:unset;box-sizing:border-box;position:relative;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;padding:8px 8px 12px;border-radius:var(--r-l);
  background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 8%,#0b0e2c),#070920);border:2px solid color-mix(in srgb,var(--acc) 28%,#1b2155);
  transition:transform .18s ease-out,border-color .18s,box-shadow .18s}
.art{display:block;width:100%;height:auto;aspect-ratio:200/110;border-radius:var(--r-s);overflow:hidden;background:var(--gpanel)}
.game b{margin-top:4px;font:900 16px/1.2 var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--acc);padding:2px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat .game b{font:400 20px/1.15 var(--display);letter-spacing:.02em;text-transform:none}
.game small{font:700 13.5px/1.25 var(--body);color:var(--dim);padding-inline:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game small.what{color:var(--cyan)}
.game:hover,.game:focus-visible{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 35%,transparent)}
.game:focus-visible{outline:3px solid #fff;outline-offset:3px}
.game:active{transform:translateY(0);transition-duration:.08s}
.game .new{position:absolute;top:2px;right:2px;z-index:1;font:400 10px/1 var(--pixel);letter-spacing:.06em;color:var(--bg);background:var(--yellow);padding:7px 8px;border-radius:var(--r-s)}
.game .new.upd{background:var(--cyan)}

/* the game sheet: opens when you pick a game. Art and name on the left, questions on the right, Press Start always in view */
.sheet{padding:0;border:0;background:transparent;color:var(--fg);max-width:none;max-height:none;width:min(1000px,calc(100vw - 32px));height:min(560px,calc(100vh - 32px));overflow:visible}
.sheet::backdrop{background:rgba(2,3,12,.78)}
.sheet .box{height:100%;display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);border-radius:var(--r-l);overflow:hidden;
  background:#0a0d29;border:2px solid var(--acc,var(--line));box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 28px color-mix(in srgb,var(--acc,var(--cyan)) 30%,transparent)}
@media (prefers-reduced-motion:no-preference){ .sheet[open] .box{animation:rise .26s cubic-bezier(.2,.8,.3,1)} .sheet[open]::backdrop{animation:fade .2s ease-out} }
.gside{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s4);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 14%,#0b0e2c),#080a22);min-width:0}
.gside .art{border-radius:var(--r-s);border:2px solid color-mix(in srgb,var(--acc) 50%,transparent)}
.gside h3{margin:var(--s3) 0 0;font:400 28px/1.05 var(--display);color:var(--acc);text-wrap:balance}
.gside p{margin:0;color:var(--dim);font-size:15px}
.gside p.what{color:var(--cyan)}
.back{all:unset;box-sizing:border-box;cursor:pointer;margin-top:auto;align-self:flex-start;font:400 10px/1 var(--pixel);letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);padding:10px 12px;border-radius:var(--r-s);border:2px solid transparent}
.back:hover,.back:focus-visible{border-color:var(--cyan)}
.qside{display:flex;flex-direction:column;min-width:0;min-height:0}
.qlist{flex:1;min-height:0;overflow-y:auto;padding:var(--s4) var(--s4) var(--s3);overscroll-behavior:contain}
.grp{margin:0 0 var(--s2);font:400 10px/1.5 var(--pixel);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.grp.gold{color:var(--yellow)}
.grp + .rows{margin-bottom:var(--s5)}
.note{margin:0 0 var(--s3);color:var(--fg);font-size:15px}
.rows{border-top:1px solid var(--line)}
.row{border-bottom:1px solid var(--line)}
.rh{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:var(--s3);width:100%;padding:10px 8px;border-radius:var(--r-s)}
.rh:hover{background:rgba(255,255,255,.04)}
.rh:focus-visible{outline:3px solid #fff;outline-offset:-3px}
.rh .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--dim)}
.rh .nm{flex:1;min-width:0}
.rh b{display:block;font:800 16px/1.25 var(--body);color:#fff}
.rh small{display:block;font:700 13px/1.3 var(--body);color:var(--dim)}
.rh .bn{flex:none;font:800 13px/1 var(--body);color:var(--yellow)}
.lead .rh b{color:var(--yellow)}
.row.on .dot{border-color:var(--c);background:radial-gradient(circle,var(--c) 0 42%,transparent 48%)}
.row{--c:var(--cyan)}
.lead .row{--c:var(--yellow)}
.row.on .rh{background:color-mix(in srgb,var(--c) 10%,transparent)}
.tp{padding:2px 8px 14px 38px}
.tp:empty{display:none}
.tp .whole{margin:0;font:700 14px/1.3 var(--body);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:block;padding:7px 12px;border-radius:999px;border:2px solid var(--line);color:var(--dim);font:800 14px/1.2 var(--body);cursor:pointer;transition:background .15s,color .15s}
.chip span::before{content:"○ "}
.chip input:checked + span{background:var(--c);border-color:var(--c);color:var(--bg)}
.chip input:checked + span::before{content:"✓ "}
.chip input:focus-visible + span{outline:3px solid #fff;outline-offset:2px}
.go{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-top:1px solid var(--line);background:#070920}
.go .sum{flex:1;min-width:0;font:800 15px/1.3 var(--body);color:var(--fg)}
.go .sum small{display:block;font:400 9px/1.6 var(--pixel);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.go .sum .bn{color:var(--yellow)}
/* Press Start: a real arcade button. It sits on a darker base and sinks when pressed (no looping glow) */
.play{flex:none;font:400 15px/1 var(--pixel);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--bg);background:var(--yellow);padding:16px 22px;border-radius:var(--r-s);
  box-shadow:0 5px 0 #b38a00,0 8px 18px rgba(255,225,58,.28);transition:transform .1s ease-out,box-shadow .1s ease-out}
.play:hover{transform:translateY(-1px);box-shadow:0 6px 0 #b38a00,0 10px 22px rgba(255,225,58,.4)}
.play:focus-visible{outline:3px solid #fff;outline-offset:3px}
.play:active{transform:translateY(5px);box-shadow:0 0 0 #b38a00,0 2px 8px rgba(255,225,58,.3)}
.play[aria-disabled="true"]{background:#1a1f4a;color:var(--dim);box-shadow:none;pointer-events:none}

/* suggestion box: a quiet line at the bottom, not another box */
.ideas{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s4);padding-top:var(--s4);border-top:1px solid var(--line);color:var(--dim);font-size:15px}
.ideas[hidden]{display:none}
.ideas a{font-weight:800;color:var(--fg);text-decoration:underline;text-decoration-color:var(--pink);text-underline-offset:4px;text-decoration-thickness:2px}
.ideas a:hover,.ideas a:focus-visible{color:var(--pink);outline:none}
.made{align-self:center;font-family:var(--display);font-size:12px;letter-spacing:.1em;background:#fff;color:var(--bg);padding:5px 12px;border-radius:var(--r-s)}
.made img{height:1.2em;width:auto;vertical-align:-.25em}

@keyframes sway{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-4px) rotate(1.5deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
@keyframes burst{0%,100%{transform:scale(.95) rotate(-4deg)}50%{transform:scale(1.05) rotate(4deg)}}
@keyframes halo{0%,100%{transform:scale(.9);opacity:.16}50%{transform:scale(1.1);opacity:.3}}
@keyframes twinkle{50%{opacity:.1}}
@keyframes rise{from{transform:translateY(24px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){:root{--ms:7000ms}.star{animation:none}.game,.lb,.play,.chip span{transition:none}}

@media (max-width:760px){
  header{grid-template-columns:1fr auto;grid-template-areas:"home lb" "brand brand"}
  .home{grid-area:home}.lb{grid-area:lb;padding:10px 12px;font-size:9px}.brand{grid-area:brand;justify-self:center}
  .games,.games.feat{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .sheet{width:100vw;height:calc(100dvh - 24px);margin:auto 0 0;max-width:100vw}
  .sheet .box{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);border-radius:var(--r-l) var(--r-l) 0 0;border-bottom:0}
  .gside{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:4px 12px;padding:12px 16px}
  .gside .art{grid-row:span 3}
  .gside h3{margin:0;font-size:20px}
  .gside p.d{display:none}
  .back{margin:0;grid-column:2;padding:6px 0}
  .qlist{padding:12px 16px}
  .go{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
  .play{padding:14px 14px;font-size:12px}
}
</style>
</head>

/* Teacher settings (data/topics.json): Mr. Spitz changes them on topics.html, the teacher control panel; games/questions.js reads the same
   file. hidden sets go away, topics that are off go away, and while assign lists sets students can only pick those sets and topics
   (the banner says "Assigned by Mr. Spitz"). The last copy that loaded stays in this browser; DEF is used when neither is there. */
var TOPICS=(function(){
  var DEF={ hidden:[], off:{}, assign:[], suggest:{ sets:[], note:'' }, bonus:25 }, t=null, K='spitz_topics';
  /* a copy fetched in the last minute is used as is, like the games do (on slow Wi-Fi the hub doesn't sit blank waiting on the site; 2026-10-30) */
  try{ if(Date.now()-(+localStorage.getItem(K+'_at')||0)<60e3) t=JSON.parse(localStorage.getItem(K)); }catch(e){ t=null; }
  if(!t||typeof t!=='object') try{ var x=new XMLHttpRequest(); x.open('GET','../data/topics.json?v='+Math.floor(Date.now()/60000),false); x.send();
    if(x.status===200){ t=JSON.parse(x.responseText); try{ localStorage.setItem(K,x.responseText); localStorage.setItem(K+'_at',String(Date.now())); }catch(e){} } }catch(e){ t=null; }
  if(!t||typeof t!=='object') try{ t=JSON.parse(localStorage.getItem(K)); }catch(e){ t=null; }
  if(!t||typeof t!=='object') t=DEF;
  function ids(a){ return Array.isArray(a)?a.filter(function(v){ return typeof v==='string'; }):[]; }
  function list(a){ return Array.isArray(a)?a.filter(function(k){ return k&&typeof k.id==='string'; }).map(function(k){ return { id:k.id, topics:ids(k.topics) }; }):[]; }
  var off={}; if(t.off&&typeof t.off==='object') Object.keys(t.off).forEach(function(s){ off[s]=ids(t.off[s]); });
  var sg=t.suggest&&typeof t.suggest==='object'?t.suggest:{};
  return { hidden:ids(t.hidden), off:off, assign:list(t.assign), suggest:{ sets:list(sg.sets), note:typeof sg.note==='string'?sg.note:'' },
    bonus:typeof t.bonus==='number'&&t.bonus>=0?Math.min(100,Math.round(t.bonus)):DEF.bonus };
})();
var OPEN=SETS.filter(function(x){ return TOPICS.hidden.indexOf(x.id)<0; }).map(function(x){ var off=TOPICS.off[x.id]||[], tp=x.topics.filter(function(t){ return off.indexOf(t[0])<0; });
  return {id:x.id,name:x.name,unit:x.unit,whole:x.whole,topics:tp.length?tp:x.topics}; });
function pick(k){ var s=OPEN.filter(function(x){ return x.id===k.id; })[0]; if(!s) return null;
  var tp=k.topics.length?s.topics.filter(function(t){ return k.topics.indexOf(t[0])>=0; }):s.topics; return {id:s.id,name:s.name,unit:s.unit,whole:s.whole,topics:tp.length?tp:s.topics}; }
var ASSIGN=TOPICS.assign.map(pick).filter(Boolean);
SETS=ASSIGN.length?ASSIGN:OPEN;
/* first visit: start on the first suggested skill, so a student who only picks a game still plays what Mr. Spitz suggests */
var FIRST=(TOPICS.suggest.sets.map(function(k){ return k.id; }).filter(function(id){ return SETS.some(function(x){ return x.id===id; }); })[0])||SETS[0].id;
var st={game:null,set:FIRST,t:{}};
SETS.forEach(function(x){ st.t[x.id]=x.topics.map(function(t){ return t[0]; }); });
/* retired topic ids in saved picks: slope's 'yint' merged into 'slope' (Kody, 2026-10-19) */
var ALIAS={ slope:{ yint:'slope' } };
try{ var sv=JSON.parse(localStorage.getItem('spitz_hub2')||'null'); if(sv&&sv.t) SETS.forEach(function(x){ if(sv.t[x.id]) st.t[x.id]=sv.t[x.id].map(function(t){ return (ALIAS[x.id]||{})[t]||t; }).filter(function(t,i,a){ return a.indexOf(t)===i; }).filter(function(t){ return x.topics.some(function(y){ return y[0]===t; }); }); }), st.game=sv.game||null, st.set=sv.set||FIRST; }catch(e){}
if(!SETS.some(function(x){ return x.id===st.set; })) st.set=SETS[0].id;
/* a whole set (multiplication, Kody 2026-10-30) always plays every topic on offer: students can't pick single fact groups */
function allOf(x){ return x.topics.map(function(t){ return t[0]; }); }
SETS.forEach(function(x){ if(!st.t[x.id].length||x.whole) st.t[x.id]=allOf(x); });
function $(i){ return document.getElementById(i); }
function save(){ try{ localStorage.setItem('spitz_hub2',JSON.stringify(st)); }catch(e){} }
function esc(v){ return String(v).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function card(g){ return '<button class="game" type="button" style="--acc:'+g.acc+';--gpanel:'+g.panel+'" data-g="'+g.id+'" aria-haspopup="dialog">'+(g.isNew?'<span class="new">NEW</span>':g.isUpd?'<span class="new upd">UPDATED</span>':'')+'<svg class="art" viewBox="0 0 200 110" aria-hidden="true">'+g.art+'</svg><b>'+g.name+'</b>'+(g.isUpd?'<small class="what" title="'+esc(g.more)+'">'+esc(g.what)+'</small>':'<small>'+g.d+'</small>')+'</button>'; }
/* new and updated games get their own bigger row (they are never shown twice) */
var FEAT=GAMES.filter(function(g){ return g.isNew||g.isUpd; });
$('games-feat').innerHTML=FEAT.map(card).join(''); $('feat').hidden=!FEAT.length;
$('games').innerHTML=GAMES.filter(function(g){ return !(g.isNew||g.isUpd); }).map(card).join('');

/* does this pick earn the score bonus? Same rule as scorecode.js bonusPct: the set is suggested or assigned, and every topic played is one it names */
function bonusFor(id,ts){ if(!(TOPICS.bonus>0)) return 0;
  return TOPICS.suggest.sets.concat(TOPICS.assign).some(function(k){ return k.id===id&&(!k.topics.length||ts.every(function(t){ return k.topics.indexOf(t)>=0; })); })?TOPICS.bonus:0; }
function gameOf(){ return GAMES.filter(function(x){ return x.id===st.game; })[0]; }
function same(a,b){ return a.length===b.length&&a.every(function(t){ return b.indexOf(t)>=0; }); }

/* Suggested skills (Kody, 2026-10-19): Mr. Spitz points students at what to practice, set on topics.html (TOPICS.suggest). A suggestion can
   name topics; picking it picks exactly those. Suggested and assigned runs earn TOPICS.bonus percent on the score (scorecode.js).
   While the lock is on, the assigned sets lead the list and only suggestions inside the assignment show.
   Each set shows once: a set in the gold group is left out of "All question sets". */
var LOCK=ASSIGN.length, LEAD=(function(){
  var as=ASSIGN.map(function(s){ var o=OPEN.filter(function(x){ return x.id===s.id; })[0]; return {s:s,t:o&&s.topics.length<o.topics.length?s.topics.map(function(t){ return t[0]; }):[],as:1}; }),
    sug=TOPICS.suggest.sets.map(function(k){ var s=SETS.filter(function(x){ return x.id===k.id; })[0]; return s&&{s:s,t:k.topics.filter(function(t){ return s.topics.some(function(y){ return y[0]===t; }); })}; }).filter(Boolean);
  /* an assigned set that is also suggested with the same topics shows once, as suggested */
  as=as.filter(function(a){ return !sug.some(function(k){ return k.s.id===a.s.id&&same(want(k),want(a)); }); });
  return sug.concat(as);
})();
function want(k){ return k.t.length&&!k.s.whole?k.t.slice():allOf(k.s); }
function rowHtml(s,k,i){ var tn=k&&k.t.length?k.t.map(function(t){ return s.topics.filter(function(y){ return y[0]===t; })[0][1]; }):[], bn=k?bonusFor(s.id,want(k)):0;
  return '<div class="row" data-s="'+s.id+'"'+(k?' data-k="'+i+'"':'')+'><button class="rh" type="button" aria-pressed="false"><span class="dot" aria-hidden="true"></span><span class="nm"><b>'+esc(s.name)+'</b><small>'+esc(tn.length?tn.join(', '):s.unit)+'</small></span>'+(bn?'<span class="bn">⭐ +'+bn+'%</span>':'')+'</button><div class="tp"></div></div>'; }
(function(){
  var leadIds=LEAD.map(function(k){ return k.s.id; }), rest=SETS.filter(function(s){ return leadIds.indexOf(s.id)<0; }), note=TOPICS.suggest.note.trim(), h='';
  if(LEAD.length){ var anyAs=LEAD.some(function(k){ return k.as; }), anySug=LEAD.some(function(k){ return !k.as; });
    h+='<p class="grp gold">'+(anyAs?'📌 Assigned':'')+(anyAs&&anySug?' and ':'')+(anySug?(anyAs?'suggested':'⭐ Suggested')+' by Mr. Spitz':' by Mr. Spitz')+(TOPICS.bonus?' · +'+TOPICS.bonus+'% score bonus':'')+'</p>'+
      (note?'<p class="note">'+esc(note)+'</p>':'')+'<div class="rows lead">'+LEAD.map(function(k,i){ return rowHtml(k.s,k,i); }).join('')+'</div>'; }
  if(rest.length) h+='<p class="grp">'+(LEAD.length?'All question sets':'Question sets')+'</p><div class="rows">'+rest.map(function(s){ return rowHtml(s,null); }).join('')+'</div>';
  $('qlist').innerHTML=h;
})();
/* which row is lit: a gold row whose topics match, else the first gold row of that set, else the set's own row */
function activeRow(){ var ts=st.t[st.set], k=-1;
  LEAD.forEach(function(x,i){ if(k<0&&x.s.id===st.set&&same(want(x),ts)) k=i; });
  if(k<0) LEAD.forEach(function(x,i){ if(k<0&&x.s.id===st.set) k=i; });
  return k>=0?document.querySelector('.row[data-k="'+k+'"]'):document.querySelector('.row[data-s="'+st.set+'"]:not([data-k])'); }
function render(){
  var g=gameOf(), s=SETS.filter(function(x){ return x.id===st.set; })[0], ts=st.t[st.set], ok=g&&ts.length, p=$('play'), bn=bonusFor(st.set,ts), on=activeRow();
  document.querySelectorAll('.row').forEach(function(r){ var a=r===on; r.classList.toggle('on',a); r.querySelector('.rh').setAttribute('aria-pressed',a?'true':'false');
    var tp=r.querySelector('.tp'); if(!a){ tp.innerHTML=''; return; }
    if(tp.dataset.s!==st.set||!tp.innerHTML) tp.innerHTML=s.whole?'<p class="whole">'+esc(s.whole)+'</p>':'<div class="chips">'+s.topics.map(function(t){ return '<label class="chip"><input type="checkbox" id="t-'+s.id+'-'+t[0]+'" data-s="'+s.id+'" value="'+t[0]+'"><span>'+t[1]+'</span></label>'; }).join('')+'</div>';
    tp.dataset.s=st.set; });
  document.querySelectorAll('.chip input').forEach(function(c){ c.checked=st.t[c.dataset.s].indexOf(c.value)>=0; });
  p.setAttribute('aria-disabled',ok?'false':'true');
  p.href=ok?'../games/'+g.id+'.html?set='+st.set+'&topics='+ts.join(','):'#';
  $('sum').innerHTML='<small>Questions</small>'+(!ts.length?'Turn on at least one topic':esc(s.name)+(s.whole?'':ts.length<s.topics.length?' · '+ts.length+' of '+s.topics.length+' topics':' · all topics')+(bn?' <span class="bn">⭐ +'+bn+'%</span>':''));
  if(g){ var b=$('sheet').querySelector('.box'); b.style.setProperty('--acc',g.acc); $('g-art').style.setProperty('--gpanel',g.panel); $('g-art').innerHTML=g.art; $('g-name').textContent=g.name;
    $('g-d').className=g.isUpd?'d what':'d'; $('g-d').textContent=g.isUpd?g.more:g.d; }
}
var sheet=$('sheet');
function open(id){ st.game=id; save(); render(); if(!sheet.open){ if(sheet.showModal) sheet.showModal(); else sheet.setAttribute('open',''); }
  var on=document.querySelector('.row.on'); if(on) on.scrollIntoView({block:'nearest'}); $('play').focus({preventScroll:true}); }
function shut(){ if(sheet.close) sheet.close(); else sheet.removeAttribute('open'); var b=document.querySelector('.game[data-g="'+st.game+'"]'); if(b) b.focus({preventScroll:true}); }
document.querySelectorAll('.games').forEach(function(el){ el.addEventListener('click',function(e){ var b=e.target.closest('.game'); if(b) open(b.dataset.g); }); });
$('back').addEventListener('click',shut);
sheet.addEventListener('click',function(e){ if(e.target===sheet) shut(); });   /* a click on the dark backdrop closes it */
$('qlist').addEventListener('click',function(e){ var h=e.target.closest('.rh'); if(!h) return; var r=h.parentNode;
  if(r.dataset.k!=null){ var k=LEAD[+r.dataset.k]; st.set=k.s.id; st.t[k.s.id]=want(k); } else st.set=r.dataset.s; save(); render(); });
$('qlist').addEventListener('change',function(e){ var el=e.target;
  var a=st.t[el.dataset.s]; if(el.checked){ if(a.indexOf(el.value)<0) a.push(el.value); } else st.t[el.dataset.s]=a.filter(function(v){ return v!==el.value; }); st.set=el.dataset.s;
  save(); render(); });
render();

/* Suggestion box: Kody's Google Form. "Report a bug" picks Bug Report; "Suggest a game" fills "New game" for which game. */
var SUGGEST={ url:'https://docs.google.com/forms/d/e/1FAIpQLSfJp4VJRFwsSnooAHdo0IaZJ6xIkwfvS65QXhhmjwP0glgwQQ/viewform', bug:'entry.93708501=Bug+Report', idea:'entry.634051978=New+game' };
(function(){ if(!SUGGEST.url) return;
  $('idea-bug').href=SUGGEST.url+'?usp=pp_url&'+SUGGEST.bug; $('idea-game').href=SUGGEST.url+'?usp=pp_url&'+SUGGEST.idea; $('ideas').hidden=false; })();
</script>
</body>
