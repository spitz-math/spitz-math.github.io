<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spitz Arcade - Leaderboard</title>
<link rel="icon" href="trophy.svg" type="image/svg+xml">
<link href="fonts/bungee-pressstart2p-nunito-5675ec.css" rel="stylesheet" onerror="this.onerror=null;this.href='https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&family=Nunito:wght@600;700;800;900&display=swap'">
<style>
/* Leaderboard, neon arcade look to match the launch pad and the arcade hub: same night sky, scanlines, floor grid and moving burger.
   Left: every game with its #1. Right: the picked game's top 10 as an arcade high-score table. On narrow screens the board
   comes first and the game list sits under it. Scores come from data/leaderboard.json, which the teacher page (teacher.html)
   posts after checking names. No flashing: only slow glows and bobs. */
:root{
  color-scheme:dark;
  --ms:3600ms;
  --bg:#06081a; --bg2:#02030c; --panel:rgba(8,11,36,.86); --line:#262d66;
  --fg:#eaf6ff; --dim:rgba(234,246,255,.62);
  --pink:#ff2bd6; --cyan:#21e6ff; --yellow:#ffe13a; --orange:#ff7a1a;
  --gold:#ffd23f; --silver:#cfd8ea; --bronze:#ff9b54;
  --display:'Bungee',Impact,sans-serif; --pixel:'Press Start 2P',monospace; --body:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;color:var(--fg);font:600 16px/1.45 var(--body);min-height:100vh;position:relative;overflow-x:hidden;
  background:linear-gradient(180deg,#0a0f33 0%,var(--bg) 40%,var(--bg2) 100%) fixed var(--bg);
  padding:0 max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.03) 0 1px,transparent 1px 4px),radial-gradient(ellipse at 50% 120%,rgba(33,230,255,.14),transparent 55%)}
.bgfx::after{content:"";position:absolute;left:-20%;right:-20%;bottom:0;height:34%;opacity:.55;
  background:repeating-linear-gradient(90deg,rgba(255,43,214,.28) 0 2px,transparent 2px 70px),repeating-linear-gradient(180deg,rgba(33,230,255,.28) 0 2px,transparent 2px 46px);
  transform:perspective(500px) rotateX(62deg);transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 60%);mask-image:linear-gradient(180deg,transparent,#000 60%)}
.star{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.5;pointer-events:none;z-index:0;animation:twinkle 2.6s ease-in-out infinite}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* header: back to the arcade, burger + title, updated time */
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-top:18px}
.home{justify-self:start;font-family:var(--pixel);font-size:10px;letter-spacing:.08em;color:var(--cyan);text-decoration:none;text-transform:uppercase;padding:10px 12px;border:2px solid transparent;border-radius:8px}
.home:hover,.home:focus-visible{border-color:var(--cyan);box-shadow:0 0 10px var(--cyan);outline:none}
.brand{display:flex;align-items:center;gap:14px}
.logo{position:relative;flex:none;width:clamp(70px,8.4vw,104px);aspect-ratio:1312/1199}
.logo img{position:absolute;inset:0;width:100%;height:100%;display:block;will-change:transform}
.logo .burst{animation:burst calc(var(--ms)*1.25) ease-in-out infinite;filter:drop-shadow(0 0 3px #fff7b0) drop-shadow(0 0 8px var(--yellow)) drop-shadow(0 0 16px rgba(255,122,26,.7))}
.logo .patty{animation:bob var(--ms) ease-in-out infinite;animation-delay:-700ms;transform-origin:50% 60%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}
.logo .halo{position:absolute;inset:4%;border-radius:50%;background:radial-gradient(circle,var(--yellow) 0%,var(--orange) 30%,transparent 65%);opacity:.22;filter:blur(12px);animation:halo var(--ms) ease-in-out infinite}
h1{font-family:var(--display);font-weight:400;margin:0;line-height:1;text-align:center;white-space:nowrap;
  font-size:clamp(28px,5vw,60px);letter-spacing:.05em;text-transform:uppercase;padding:.04em .1em;
  background:linear-gradient(180deg,#fff27a 0%,var(--yellow) 22%,#ff9d14 50%,var(--orange) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  -webkit-text-stroke:.07em #140800;paint-order:stroke fill;
  filter:drop-shadow(.05em .06em 0 #140800) drop-shadow(0 0 3px #fff7b0) drop-shadow(0 0 12px #ffb21f) drop-shadow(0 0 26px rgba(255,122,26,.75));
  animation:sway var(--ms) ease-in-out infinite;will-change:transform}
.sub{margin:8px 0 0;text-align:center;font:400 clamp(8px,.9vw,11px)/1.4 var(--pixel);letter-spacing:.14em;text-transform:uppercase;color:var(--pink);text-shadow:0 0 8px var(--pink)}
.upd{justify-self:end;margin:0;text-align:right;font:400 9px/1.8 var(--pixel);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}

/* two columns: game list | board */
.hall{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:20px;align-items:start}
.list h2{margin:0 0 10px;display:flex;justify-content:space-between;gap:8px;font:400 10px/1.4 var(--pixel);letter-spacing:.08em;text-transform:uppercase;color:var(--pink);text-shadow:0 0 8px var(--pink)}
.games{display:flex;flex-direction:column;gap:8px}
/* the game list scrolls in its own box beside the board, so the page stays one screen tall however many games there are */
@media (min-width:861px){
  .list{position:sticky;top:12px}
  .games{max-height:calc(100vh - 56px);overflow-y:auto;overscroll-behavior:contain;padding:9px 10px 9px 5px;margin:-9px -10px 0 -5px;
    scrollbar-width:thin;scrollbar-color:var(--pink) rgba(17,22,63,.6);
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 10px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(180deg,transparent 0,#000 10px,#000 calc(100% - 22px),transparent)}
}
.game{all:unset;box-sizing:border-box;position:relative;cursor:pointer;display:grid;grid-template-columns:72px minmax(0,1fr);align-items:center;gap:12px;padding:6px 10px 6px 6px;border-radius:12px;
  background:var(--panel);border:2px solid color-mix(in srgb,var(--acc) 35%,#1b2155);transition:transform .2s,box-shadow .2s,border-color .2s}
.game .art{display:block;width:72px;height:40px;border-radius:7px;overflow:hidden;background:var(--gpanel,#11163f)}
.noart{display:grid;place-items:center;font-size:20px}
.game b{display:block;font:400 15px/1.2 var(--display);letter-spacing:.02em;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 8px color-mix(in srgb,var(--acc) 60%,transparent)}
.game small{display:block;font:700 13px/1.3 var(--body);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game small i{font-style:normal;color:var(--fg)}
.game:hover{transform:translateX(3px);border-color:var(--acc);box-shadow:0 0 10px color-mix(in srgb,var(--acc) 55%,transparent)}
.game:focus-visible{outline:3px solid #fff;outline-offset:2px}
.game[aria-pressed="true"]{border:3px solid var(--acc);box-shadow:0 0 0 2px #fff,0 0 18px var(--acc),inset 0 0 18px color-mix(in srgb,var(--acc) 25%,transparent);transform:translateX(3px)}
.game .new{position:absolute;top:-7px;right:8px;font:400 8px/1 var(--pixel);letter-spacing:.06em;color:var(--bg);background:var(--yellow);padding:5px 6px;border-radius:5px;box-shadow:0 0 8px var(--yellow)}

/* the board: an arcade high-score screen in the game's color */
.panel{position:sticky;top:16px;border-radius:20px;border:3px solid var(--acc,var(--cyan));padding:clamp(16px,2.6vw,26px);background:var(--panel);
  box-shadow:0 0 16px var(--acc,var(--cyan)),0 0 40px color-mix(in srgb,var(--acc,var(--cyan)) 30%,transparent),inset 0 0 30px color-mix(in srgb,var(--acc,var(--cyan)) 14%,transparent)}
.ptop{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.ptop svg{width:130px;height:auto;aspect-ratio:200/110;border-radius:10px;flex:none;border:2px solid var(--acc)}
.ptop h2{margin:0;font:400 clamp(24px,3.4vw,40px)/1.05 var(--display);letter-spacing:.03em;text-transform:uppercase;color:#fff;text-shadow:0 0 8px var(--acc),0 0 22px var(--acc)}
.ptop .k{display:block;margin-top:8px;font:400 10px/1.5 var(--pixel);letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.head,.lb{display:grid;grid-template-columns:62px minmax(0,1fr) auto 64px;gap:14px;align-items:center;padding:0 14px}
.head{font:400 9px/1 var(--pixel);letter-spacing:.08em;color:var(--dim);text-transform:uppercase;padding-bottom:8px}
.head span:nth-child(3),.head span:nth-child(4){text-align:right}
.board{display:flex;flex-direction:column;gap:7px}
.lb{--r:var(--dim);min-height:56px;border-radius:12px;border:2px solid transparent;background:rgba(17,22,63,.55)}
.lb .rk{font:400 13px/1 var(--pixel);color:var(--r);text-shadow:0 0 6px color-mix(in srgb,var(--r) 60%,transparent)}
.lb .nm{min-width:0;font:900 18px/1.2 var(--body);overflow-wrap:anywhere}
.lb .meta{display:block;font:700 12.5px/1.3 var(--body);color:var(--dim)}
.lb .sc{font:400 clamp(13px,1.5vw,17px)/1 var(--pixel);text-align:right;color:#fff;white-space:nowrap}
.lb .ac{font:800 15px/1 var(--body);text-align:right;color:var(--dim)}
.lb.g1{--r:var(--gold);border-color:var(--gold);background:rgba(255,210,63,.1);box-shadow:0 0 12px rgba(255,210,63,.45)}
.lb.g1 .sc{color:var(--gold);text-shadow:0 0 8px rgba(255,210,63,.7)}
.lb.g2{--r:var(--silver);border-color:color-mix(in srgb,var(--silver) 70%,transparent)}
.lb.g3{--r:var(--bronze);border-color:color-mix(in srgb,var(--bronze) 70%,transparent)}
.empty{padding:30px 16px;text-align:center;border:2px dashed var(--line);border-radius:14px;color:var(--dim)}
.empty b{display:block;margin-bottom:10px;font:400 13px/1.6 var(--pixel);color:var(--yellow);text-shadow:0 0 8px rgba(255,225,58,.6)}
.how{margin:18px 0 0;padding-top:14px;border-top:2px dashed var(--line);font-size:14.5px;color:var(--dim);text-align:center}
.made{align-self:center;font-family:var(--display);font-size:12px;letter-spacing:.1em;background:#fff;color:var(--bg);padding:5px 12px;border-radius:6px;box-shadow:0 0 10px #fff}
.made img{height:1.2em;width:auto;vertical-align:-.25em}

@keyframes sway{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-4px) rotate(1.5deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
@keyframes burst{0%,100%{transform:scale(.95) rotate(-4deg)}50%{transform:scale(1.05) rotate(4deg)}}
@keyframes halo{0%,100%{transform:scale(.9);opacity:.16}50%{transform:scale(1.1);opacity:.3}}
@keyframes twinkle{50%{opacity:.1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:no-preference){.lb{animation:rise .4s both}}
@media (prefers-reduced-motion:reduce){:root{--ms:7000ms}.star{animation:none}.game{transition:none}}

@media (max-width:860px){
  header{grid-template-columns:1fr auto;grid-template-areas:"home upd" "brand brand"}
  .home{grid-area:home}.upd{grid-area:upd}.brand{grid-area:brand;justify-self:center}
  .hall{grid-template-columns:minmax(0,1fr)}
  .panel{position:static;order:-1}
  .games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
}
@media (max-width:560px){
  .head,.lb{grid-template-columns:44px minmax(0,1fr) auto;gap:10px;padding:0 10px}
  .head span:nth-child(4),.lb .ac{display:none}
  .lb .nm{font-size:16px}
  .ptop svg{width:90px}
  .lb .rk{font-size:10px}
  .lb .meta{font-size:12px}
}
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true"></div>
<span class="star" style="left:8%;top:12%"></span><span class="star" style="left:22%;top:30%;animation-delay:.7s"></span><span class="star" style="left:88%;top:18%;animation-delay:1.3s"></span><span class="star" style="left:76%;top:40%;animation-delay:.3s"></span><span class="star" style="left:14%;top:55%;animation-delay:1.9s"></span><span class="star" style="left:93%;top:52%;animation-delay:1.1s"></span><span class="star" style="left:40%;top:8%;animation-delay:2.2s"></span><span class="star" style="left:62%;top:6%;animation-delay:.5s"></span>

<div class="wrap">
  <header>
    <a class="home" href="arcade/">◀ Back to the games</a>
    <div class="brand">
      <div class="logo" aria-hidden="true"><div class="halo"></div><img class="burst" src="/launchpad_burst.webp" alt="" width="1312" height="1199"><img class="patty" src="/launchpad_patty.webp" alt="" width="1312" height="1199"></div>
      <div><h1>Leaderboard</h1><p class="sub">Spitz Arcade high scores</p></div>
    </div>
    <p class="upd" id="upd">Loading scores…</p>
  </header>

  <div class="hall">
    <section class="list" aria-label="Pick a game">
      <h2><span>Pick a game</span><span id="count"></span></h2>
      <div class="games" id="games"></div>
    </section>

    <section class="panel" id="panel" hidden aria-live="polite">
      <div class="ptop"><span id="p-art"></span><div><h2 id="p-title"></h2><span class="k" id="p-sub"></span></div></div>
      <div class="head" id="p-head"><span>Rank</span><span>Name</span><span>Score</span><span>Acc</span></div>
      <div class="board" id="board"></div>
      <p class="how">Want a spot? Finish a game, then send your score code with the button on the end screen. Scores show up here after Mr. Spitz checks them.</p>
    </section>
  </div>

  <span class="made">MADE BY SPITZ <img src="/burger_mark.png" alt="🍔"></span>
</div>

<script src="games/catalog.js"></script>
<script>
(function(){
var $=function(i){ return document.getElementById(i); }, CAT=window.SpitzGames||[], data={ games:{} }, sel=null;
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function list(){ var ids=CAT.map(function(g){ return g.id; }), out=CAT.slice();
  Object.keys(data.games||{}).forEach(function(id){ if(ids.indexOf(id)<0&&(window.SpitzLocked||[]).indexOf(id)<0) out.push({ id:id, name:data.games[id].name||id, acc:'#FFB020' }); });
  return out; }
function artOf(g){ return g.art?'<svg class="art" viewBox="0 0 200 110" aria-hidden="true">'+g.art+'</svg>':'<div class="art noart" aria-hidden="true">🏆</div>'; }
function vars(g){ return '--acc:'+g.acc+(g.panel?';--gpanel:'+g.panel:''); }
function fmtDay(s){ if(!s) return ''; var p=s.split('-'); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).toLocaleDateString(undefined,{month:'short',day:'numeric',timeZone:'UTC'}); }
var ORD=['1ST','2ND','3RD'];

function render(){
  var games=list();
  $('games').innerHTML=games.map(function(g){ var b=data.games[g.id], t=b&&b.top&&b.top[0];
    return '<button class="game" type="button" style="'+vars(g)+'" data-g="'+esc(g.id)+'" aria-pressed="'+(g.id===sel)+'">'+(g.isNew?'<span class="new">NEW</span>':'')+artOf(g)+'<span style="min-width:0"><b>'+esc(g.name)+'</b><small>'+(t?'👑 <i>'+esc(t.name)+'</i> · '+esc(t.score):'No scores yet')+'</small></span></button>'; }).join('');
  $('count').textContent=games.length+' games';
  var g=games.filter(function(x){ return x.id===sel; })[0];
  if(!g){ $('panel').hidden=true; return; }
  var b=data.games[g.id], top=(b&&b.top)||[];
  $('panel').hidden=false; $('panel').setAttribute('style',vars(g));
  $('p-art').innerHTML=g.art?'<svg viewBox="0 0 200 110" aria-hidden="true">'+g.art+'</svg>':'';
  $('p-title').textContent=g.name;
  $('p-sub').textContent=top.length?'Top 10 · best score per player':'Top 10';
  $('p-head').hidden=!top.length;
  $('board').innerHTML=top.length?top.map(function(e,i){
      var meta=[e.bonus?'⭐ Suggested skill bonus':'',e.set,fmtDay(e.date)].filter(Boolean).join(' · ');
      return '<div class="lb'+(i<3?' g'+(i+1):'')+'" style="animation-delay:'+(i*50)+'ms"><span class="rk">'+(ORD[i]||(i+1)+'TH')+'</span><span class="nm">'+esc(e.name)+(meta?'<span class="meta">'+esc(meta)+'</span>':'')+'</span><span class="sc">'+esc(e.score)+'</span><span class="ac" title="Accuracy">'+(e.acc==null?'':esc(e.acc)+'%')+'</span></div>'; }).join('')
    :'<div class="empty"><b>No scores yet</b>Nobody is on the '+esc(g.name)+' board yet. Be the first!</div>';
}
function pick(id,scroll){ sel=id; try{ history.replaceState(null,'','#'+id); }catch(e){} render();
  if(scroll&&window.innerWidth<=860) $('panel').scrollIntoView({ behavior:'smooth', block:'start' }); }
$('games').addEventListener('click',function(e){ var b=e.target.closest('.game'); if(b) pick(b.dataset.g,true); });

fetch('data/leaderboard.json?t='+Date.now(),{ cache:'no-store' }).then(function(r){ if(!r.ok) throw r; return r.json(); })
  .then(function(d){ data=d&&d.games?d:{ games:{} };
    $('upd').textContent=data.updated?'Updated '+new Date(data.updated).toLocaleString(undefined,{ month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }):'No scores posted yet.'; })
  .catch(function(){ $('upd').textContent='Couldn’t load the scores. Refresh to try again.'; })
  .then(function(){ var h=decodeURIComponent((location.hash||'').slice(1)), ids=list().map(function(g){ return g.id; });
    sel=ids.indexOf(h)>=0?h:(ids.filter(function(id){ return data.games[id]&&data.games[id].top&&data.games[id].top.length; })[0]||ids[0]||null);
    render(); var on=document.querySelector('.game[aria-pressed="true"]'), box=$('games');
    if(on&&box.scrollHeight>box.clientHeight) box.scrollTop=on.offsetTop-box.offsetTop-box.clientHeight/3; });
render();
})();
</script>
</body>
</html>
