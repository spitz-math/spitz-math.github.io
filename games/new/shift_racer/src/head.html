<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Spitz Arcade - Shift Racer</title>
<!-- Shift Racer remake, started from the remake kit starter (games/new/remake_kit). Source of the game: game.js is inlined here by build.py. -->
<link href="../../../../fonts/racingsansone-inter-f32000.css" rel="stylesheet">
<link href="../../remake_kit/spitz_digits.css" rel="stylesheet">
<style>
:root{ --sz-mark:#3DE0FF; --sz-ink:#A9C2EE; --panel:#0B1430; --border:#3DE0FF; --text:#fff; --muted:#A9C2EE; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:#03050C; overflow:hidden; }
body{ color:#fff; font-family:Inter,system-ui,sans-serif; -webkit-user-select:none; user-select:none; }
button{ font:inherit; color:inherit; }
button:focus-visible,a:focus-visible{ outline:4px solid var(--rk-accent); outline-offset:3px; }
[hidden]{ display:none !important; }
#stage{ position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; overflow:hidden; background:#070B1C; }
#sr-canvas{ position:absolute; left:0; top:0; width:1920px; height:1080px; }
#sr-confetti{ position:absolute; left:0; top:0; width:1920px; height:1080px; z-index:18; pointer-events:none; }
.sr-toast{ position:absolute; left:50%; top:150px; transform:translateX(-50%); z-index:30; padding:16px 30px; border-radius:4px; background:#fff; color:#0E1016; font:800 30px/1 Inter,sans-serif; }

/* ---- this game's look: set the --rk-* variables here (README.md lists them; looks/example.json is a worked example) ---- */
html:root{ --rk-word:"Racing Sans One","Inter",sans-serif; --rk-word-scale:1.5; --rk-ink:#0B0718; --rk-text:#FFFFFF; --rk-muted:#C6B8F0; --rk-accent:#FF3DB4; --rk-gold:#FFE14D;
  --rk-win:#1B1240; --rk-frame:#FF3DB4; --rk-tile:#2C1E66; --rk-go:#FFE14D; --rk-go-text:#1B1240; --rk-over:linear-gradient(#150E36,#3A1860); --rk-radius:10px;
  --rk-key-face:linear-gradient(#3A2A86,#241858); --rk-key-rim:#FF3DB4; --rk-key-low:#7A1B58; --rk-heart:#FF3DB4; --sz-mark:#FF3DB4; --sz-ink:#C6B8F0; }
.sr-garage{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin:6px 0 8px; }
.sr-car{ width:104px; height:80px; border-radius:16px; border:5px solid #0B0718; background:var(--c); cursor:pointer; font-size:28px; line-height:1; padding:0; box-shadow:inset 0 -16px 0 rgba(11,7,24,.22); }
.sr-car.on{ outline:5px solid #FFFFFF; outline-offset:3px; } .sr-car.off{ filter:saturate(.35) brightness(.6); } .sr-car:focus-visible{ outline:3px solid #3DE0FF; outline-offset:2px; }
.sr-car.pic{ background:#2A2450 center/auto 88% no-repeat; box-shadow:none; } .sr-car.pic.off{ filter:brightness(.62) saturate(.7); }
body.sr-driving .sz-fs{ display:none; }
.sr-garcap{ text-align:center; font:800 26px Inter,sans-serif; color:#C6B8F0; margin:0 0 14px; min-height:32px; }
</style>
<script src="../../../kit.js"></script>
<script src="../../../questions.js"></script>
<script src="../../../scorecode.js"></script>
<script src="../../remake_kit/remake_kit.js"></script>
</head>
<body>
<div id="stage">
  <canvas id="sr-canvas" width="960" height="540" aria-label="Shift Racer. Left and Right or A and D change lanes. Space shifts gears. Dodge traffic and reach each flag before the clock runs out."></canvas>
  <canvas id="sr-confetti" width="960" height="540" aria-hidden="true"></canvas>
  <div class="sr-toast" id="sr-toast" hidden></div>
</div>
