<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Spitz Arcade - Look test</title>
<!-- Look test: one sheet of the kit's screens (title, HUD, question, a miss, upgrade pick, pause, end) in a game's own look,
     so the look can be approved BEFORE any gameplay code. Open look.html?file=looks/example.json, or paste a look below.
     node games/new/remake_kit/look_sheet.js looks/example.json out.png saves the sheet as one picture. -->
<style>
body{ margin:0; padding:24px; background:#11131a; color:#fff; font:700 20px/1.3 Inter,system-ui,sans-serif; }
h1{ margin:0 0 6px; font-size:30px; } p{ margin:0 0 18px; color:#cfd6e6; font-weight:500; }
.g{ display:grid; grid-template-columns:repeat(auto-fill,minmax(520px,1fr)); gap:20px; }
figure{ margin:0; } figcaption{ padding:8px 2px 0; color:#cfd6e6; }
.f{ position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; border:2px solid #333; background:#000; }
.f iframe{ position:absolute; left:0; top:0; width:1366px; height:768px; border:0; transform-origin:0 0; pointer-events:none; }
details{ margin-top:22px; } textarea{ width:100%; height:260px; background:#0b0d13; color:#e9eefc; border:2px solid #333; font:14px/1.4 ui-monospace,monospace; padding:10px; box-sizing:border-box; }
button{ margin-top:10px; font:700 18px Inter,sans-serif; padding:10px 18px; border-radius:6px; border:0; background:#3DE0FF; color:#05070F; cursor:pointer; }
</style>
</head>
<body>
<h1 id="h">Look test</h1>
<p id="p">The kit's screens in this look, at Chromebook shape. Nothing here is gameplay: the squares stand in for the game.</p>
<div class="g" id="g"></div>
<details><summary>Edit the look</summary><textarea id="t" spellcheck="false"></textarea><br><button id="b" type="button">Show it</button></details>
<script>
(function(){
var STILLS=[['title','Title screen'],['hud','HUD during play'],['card','Question card'],['miss','A miss, with the reason'],['pick','Upgrade pick'],['pause','Pause box'],['end','End screen']];
var q={}; location.search.replace(/^\?/,'').split('&').forEach(function(kv){ var a=kv.split('='); if(a[0]) q[a[0]]=decodeURIComponent(a[1]||''); });
function show(look){ var g=document.getElementById('g'); g.innerHTML=''; document.getElementById('h').textContent='Look test'+(look.title?': '+look.title:'');
  var hash='#look='+encodeURIComponent(JSON.stringify(look));
  STILLS.forEach(function(s){ var fig=document.createElement('figure'), box=document.createElement('div'), fr=document.createElement('iframe'), cap=document.createElement('figcaption');
    box.className='f'; fr.src='demo.html?set='+encodeURIComponent(look.set||'slope')+'&still='+s[0]+hash; fr.title=s[1]; fr.setAttribute('data-still',s[0]); cap.textContent=s[1];
    box.appendChild(fr); fig.appendChild(box); fig.appendChild(cap); g.appendChild(fig); });
  fit(); document.getElementById('t').value=JSON.stringify(look,null,2); }
function fit(){ [].forEach.call(document.querySelectorAll('.f'),function(b){ b.firstChild.style.transform='scale('+(b.clientWidth/1366)+')'; }); }
addEventListener('resize',fit);
document.getElementById('b').addEventListener('click',function(){ try{ show(JSON.parse(document.getElementById('t').value)); }catch(e){ document.getElementById('p').textContent='That is not valid JSON: '+e.message; } });
var file=/^[a-z0-9_\/-]+\.json$/i.test(q.file||'')?q.file:'looks/example.json';
fetch(file).then(function(r){ return r.json(); }).then(show,function(){ show({ title:'default pixel look' }); });
})();
</script>
</body>
</html>
