<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Spitz Arcade - Remake Kit demo</title>
<!-- A demo of games/new/remake_kit/remake_kit.js, not a game on the hub. Gem Run is a small stand-in game that uses every kit piece, and it is the STARTER:
     `python3 games/new/remake_kit/new_game.py <name> <xx>` copies it into a new remake folder with the demo-only parts taken out. Try ?set=slope and ?look=cartoon or ?look=dungeon. -->
<link href="../../../fonts/bungee-pressstart2p-nunito-5675ec.css" rel="stylesheet">
<link href="../../../fonts/bangers-inter-0413fc.css" rel="stylesheet">
<link href="../../../fonts/pixelifysans-inter-b2a9b6.css" rel="stylesheet">
<link href="spitz_digits.css" rel="stylesheet">
<style>
:root{ --sz-mark:#3DE0FF; --sz-ink:#A9C2EE; --panel:#0B1430; --border:#3DE0FF; --text:#fff; --muted:#A9C2EE; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:#03050C; overflow:hidden; }
body{ color:#fff; font-family:Inter,system-ui,sans-serif; -webkit-user-select:none; user-select:none; }
button{ font:inherit; color:inherit; }
button:focus-visible,a:focus-visible{ outline:4px solid var(--rk-accent); outline-offset:3px; }
[hidden]{ display:none !important; }
#stage{ position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; overflow:hidden; background:#070B1C; }
#dm-canvas{ position:absolute; left:0; top:0; width:1920px; height:1080px; image-rendering:pixelated; }
#dm-confetti{ position:absolute; left:0; top:0; width:1920px; height:1080px; z-index:18; pointer-events:none; }
.dm-toast{ position:absolute; left:50%; top:150px; transform:translateX(-50%); z-index:30; padding:16px 30px; border-radius:4px; background:#fff; color:#0E1016; font:800 30px/1 Inter,sans-serif; }
.dm-looks{ position:absolute; left:36px; bottom:28px; z-index:16; display:flex; gap:18px; align-items:center; font:800 24px/1 Inter,sans-serif; color:var(--rk-muted); }
.dm-looks a{ color:var(--rk-text); padding:8px 12px; border:3px solid var(--rk-muted); border-radius:var(--rk-radius); text-decoration:none; background:var(--rk-win); }
.dm-looks a.on{ border-color:var(--rk-accent); }

/* ---- a game's own look = a handful of variables. Look 1 (pixel space) is the kit's default. ---- */
:root[data-look="cartoon"]{ --sz-ink:#2B1A12; --sz-mark:#E2452B; --rk-ink:#2B1A12; --rk-text:#2B1A12; --rk-muted:#7A5B48; --rk-accent:#E2452B; --rk-good:#2E9E4F; --rk-bad:#D5382A; --rk-gold:#B8860B;
  --rk-win:#FFF4DC; --rk-frame:#2B1A12; --rk-tile:#FFFFFF; --rk-tile-text:#2B1A12; --rk-go:#FFC82E; --rk-go-text:#2B1A12; --rk-dim:rgba(60,40,20,.45); --rk-over:#8FD8C8;
  --rk-radius:14px; --rk-word:"Bangers","Inter",sans-serif; --rk-num:"Bangers","Inter",sans-serif; --rk-word-scale:1.55;
  --rk-key-face:#FFFFFF; --rk-key-text:#2B1A12; --rk-key-rim:#2B1A12; --rk-key-low:#C9B79A; --rk-heart:#E2452B; --rk-heart-off:#C9B79A;
  --rk-ol:-3px 0 #FFF4DC,3px 0 #FFF4DC,0 -3px #FFF4DC,0 3px #FFF4DC,-3px -3px #FFF4DC,3px 3px #FFF4DC,-3px 3px #FFF4DC,3px -3px #FFF4DC;
  --c-m:#B26B00; --c-pt:#8A6D00; --c-b:#C2247F; --c-x:#0B8474; --c-ans:#7A3FC4; }
:root[data-look="dungeon"]{ --sz-ink:#B9A6CF; --sz-mark:#FFC23D; --rk-ink:#120B1C; --rk-text:#F4ECD8; --rk-muted:#B9A6CF; --rk-accent:#FFC23D; --rk-good:#7CE38B; --rk-bad:#FF8FA3; --rk-gold:#FFC23D;
  --rk-win:#241634; --rk-frame:#C9A227; --rk-tile:#3A2552; --rk-go:#FFC23D; --rk-go-text:#241634; --rk-over:rgba(18,11,28,.93);
  --rk-radius:8px; --rk-word:"Pixelify Sans","Inter",sans-serif; --rk-word-scale:1.5;
  --rk-key-face:linear-gradient(#4A2F68,#2E1C44); --rk-key-text:#F4ECD8; --rk-key-rim:#C9A227; --rk-key-low:#6E5512; --rk-heart:#E0405E; }
</style>
<script src="../../kit.js"></script>
<script src="../../questions.js"></script>
<script src="../../scorecode.js"></script>
<script src="remake_kit.js"></script>
</head>
<body>
<div id="stage">
  <canvas id="dm-canvas" width="960" height="540" aria-label="Gem Run. Arrow keys or A and D move the ship. Catch gems, dodge rocks."></canvas>
  <canvas id="dm-confetti" width="960" height="540" aria-hidden="true"></canvas>
  <div class="dm-toast" id="dm-toast" hidden></div>
  <!-- demo-only --><div class="dm-looks" id="dm-looks">Look: <a href="?look=pixel" data-l="pixel">Pixel</a><a href="?look=cartoon" data-l="cartoon">Cartoon</a><a href="?look=dungeon" data-l="dungeon">Dungeon</a></div><!-- /demo-only -->
</div>
<script>
(function(){
'use strict';
function $(id){ return document.getElementById(id); }
var prm={}; location.search.replace(/^\?/,'').split('&').forEach(function(kv){ var a=kv.split('='); if(a[0]) prm[a[0]]=decodeURIComponent(a[1]||''); });
var NAME='Gem <b>Run</b>', TAGLINE='Catch gems and dodge the rocks. Answer well at each dock for hearts and upgrades.';
var LOOK='pixel', PALS={ pixel:{sky:'#070B1C',star:'#9DB4D2',ship:'#3DE0FF',gem:'#A6FF4D',rock:'#8A7A9A',ink:'#05070F'},
          cartoon:{sky:'#8FD8C8',star:'#FFFFFF',ship:'#E2452B',gem:'#FFC82E',rock:'#7A5B48',ink:'#2B1A12'},
          dungeon:{sky:'#1A1026',star:'#4A2F68',ship:'#FFC23D',gem:'#7CE38B',rock:'#8C7BA3',ink:'#120B1C'} };
var CUSTOM=null;
function looks(on){ var e=$('dm-looks'); if(e) e.hidden=!on||!!CUSTOM; }
/* <demo-only> the three example looks, and a look handed in through the address (look.html uses this for look tests) */
if(/^(cartoon|dungeon)$/.test(prm.look)) LOOK=prm.look;
document.documentElement.setAttribute('data-look',LOOK);
[].forEach.call($('dm-looks').querySelectorAll('a'),function(a){ a.classList.toggle('on',a.dataset.l===LOOK); a.href='?look='+a.dataset.l+(prm.set?'&set='+prm.set:''); });
try{ var hm=/^#look=(.+)$/.exec(location.hash); if(hm) CUSTOM=JSON.parse(decodeURIComponent(hm[1])); }catch(e){}
if(CUSTOM){ document.documentElement.removeAttribute('data-look'); looks(false);
  Object.keys(CUSTOM.vars||{}).forEach(function(k){ if(/^--[a-z0-9-]+$/.test(k)) document.documentElement.style.setProperty(k,String(CUSTOM.vars[k])); });
  (CUSTOM.fonts||[]).forEach(function(u){ if(/^(\.\.\/|https:\/\/fonts\.googleapis\.com\/)[^"'<>]+$/.test(u)){ var l=document.createElement('link'); l.rel='stylesheet'; l.href=u; document.head.appendChild(l); } });
  if(CUSTOM.name) NAME=String(CUSTOM.name).replace(/<(?!\/?b>)[^>]*>/g,''); if(CUSTOM.tagline) TAGLINE=String(CUSTOM.tagline).replace(/</g,'&lt;');
  if(CUSTOM.pal) PALS.pixel=Object.assign({},PALS.pixel,CUSTOM.pal); }
/* </demo-only> */
var PAL=PALS[LOOK];

/* questions: the set the link picked, or plain multiplication when the page is opened bare */
var QS=window.SpitzQ?SpitzQ.forGame('dm'):null, KEY='remake_kit_demo_v2'+(QS?QS.suffix:'');
function nextQuestion(){ if(QS) return QS.next();
  var a=2+Math.floor(Math.random()*8), b=2+Math.floor(Math.random()*8), v=[a*b,a*b+a,a*b-b,(a+1)*(b+1)].sort(function(){ return Math.random()-0.5; });
  return { topic:'Multiplication', type:'mult', prompt:a+' × '+b+' = ?', explain:a+' × '+b+' = '+(a*b), choices:v.map(function(n){ return { html:String(n), ok:n===a*b, why:'' }; }) }; }

/* every number that tunes the game lives here, so a balance pass changes one line */
var CFG={ hearts:3, every:6, secs:150, boostSecs:20, gem:100, stormAt:60 };
/* test pages only (localhost or a file named like a test copy): ?secs=40 shortens the round for the bots */
var TESTBOX=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)||(location.protocol==='file:'&&/_(mult|test|candidate)/.test(location.pathname));
if(TESTBOX&&+prm.secs>=10) CFG.secs=+prm.secs;
var RES=[];   /* what each finished card reported (the tests read this) */
var S=null, W=960, H=540, ship={x:480}, gems=[], rocks=[], keys={}, gt=0, last=0, spawnG=0, spawnR=0, bestAtStart=0;
function fresh(name){ return { ver:2, name:name||'', started:false, over:false, score:0, hearts:CFG.hearts, left:CFG.secs, gems:0, sinceDock:0, boost:0, docks:0, revived:0, magnet:0, shield:0, storm:0,
  answered:0, correct:0, streak:0, best:0, topics:QS?QS.topicTable():{}, q:null, qDone:false, picked:-1, card:null, pick:null }; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function load(){ try{ var v=JSON.parse(localStorage.getItem(KEY)||'null'); if(v&&v.ver===2&&v.started&&!v.over) return v; }catch(e){} return null; }

var KIT=SpitzKit.game({ ac:function(){ return RK?RK.ac():null; }, muted:function(){ return RK?RK.muted():true; }, voice:function(){}, confetti:'dm-confetti', toast:'dm-toast' });
var RK=SpitzRemake.make({ pre:'dm', S:function(){ return S; }, save:save, next:nextQuestion, hub:'../../../arcade/', suffix:QS?QS.suffix:'', music:KIT, toast:KIT.toast });
var CONTROLS='ARROWS/WASD=Move | X/K=Dash | 1234=Answer';

var title=RK.title({ name:NAME, tagline:TAGLINE, controls:CONTROLS, onStart:function(name){ S=fresh(name); S.started=true; begin(); save(); play(true); } });
$('sz-mus').addEventListener('click',function(){ KIT.musicToggle(); }); KIT.musBtn();

/* LEFT = you and your survival. RIGHT = score and progress. */
var hud=RK.hud({ left:[ {id:'hearts',type:'hearts',max:CFG.hearts}, {id:'time',type:'num',label:'Time'} ],
                 right:[ {id:'score',type:'num',label:'Score',size:'big'}, {id:'dock',type:'bar',label:'Next dock',text:true}, {id:'streak',type:'text',label:'Streak'} ] });

/* the question moment: two questions plus a spare. 0 right still goes on (math is not fuel); 1 right = a heart; 2 right = a heart and an upgrade pick */
var card=RK.card({ fast:!!(QS&&QS.set==='mult')||!QS, kinds:{
  dock:{ title:'Dock repairs!', safe:'You are safe here.', icon:'❤️', rewards:['No reward this time.','a heart back','a heart back and an upgrade'],
    done:function(r){ RES.push(r); S.docks++; S.sinceDock=0; rocks=[]; if(r.right>=1) S.hearts=Math.min(CFG.hearts,S.hearts+1); if(r.right>=2) pick.open(1,'Both right! Pick an upgrade.'); } },
  revive:{ title:'Last chance!', safe:'One rescue per run.', need:1, spare:0, rewards:['The run ends here.','one heart: back in the run'],
    done:function(r){ RES.push(r); if(r.right){ S.hearts=1; S.revived=1; rocks=[]; RK.fx.banner('Back in the run!','',{kind:'good'}); } else endRun(); } } } });

var pick=RK.pick({ title:'Upgrade', options:function(){ return [
    { id:'magnet', name:'Magnet', desc:'Catch gems from farther away.', icon:'🧲', off:S.magnet>=2 },
    { id:'shield', name:'Shield', desc:'Blocks the next rock.', icon:'🛡️', off:S.shield>=1 },
    { id:'double', name:'Double points', desc:CFG.boostSecs+' seconds of ×2.', icon:'✨' } ]; },
  onPick:function(id){ if(id==='magnet') S.magnet++; else if(id==='shield') S.shield=1; else S.boost=CFG.boostSecs; } });

var end=RK.end({ name:NAME, onAgain:function(){ S=fresh(S.name); save(); toTitle(); } });
RK.ask({ when:function(){ return S&&S.started&&!S.over; }, onYes:function(){ S=fresh(S.name); save(); toTitle(); } });
RK.pause({ when:function(){ return S&&S.started&&!S.over; }, controls:CONTROLS, stats:function(){ return [['Score',S.score],['Gems',S.gems],['Best streak',S.best]]; }, onPause:function(){ keys={}; last=0; } });
RK.idle({ after:6, text:'Move! Catch the gems', when:function(){ return S&&S.started&&!S.over; } });

function begin(){ gems=[]; rocks=[]; ship.x=480; bestAtStart=RK.best.get(); RK.fx.clear(); }
function toTitle(){ hud.show(false); card.close(); pick.close(); RK.fx.clear(); looks(true); title.show(); }
function play(fromStart){ title.hide(); end.hide(); looks(false); hud.show(true); last=0; if(!fromStart){ begin(); if(!card.resume()) pick.resume(); } }
function endRun(){ if(S.over) return; S.over=true; S.card=null; S.pick=null; save(); hud.show(false); card.close(); pick.close(); RK.fx.clear();
  var was=RK.best.keep(S.score), won=S.left<=0;
  end.show({ score:S.score, headline:won?'You made it to the end!':'The rocks got you.', goal:RK.goal({ score:S.score, was:was, streak:S.best }),
    stats:[ ['Correct',S.correct+' / '+S.answered], ['Best streak',S.best], ['Gems',S.gems] ], topics:S.topics, code:'DEMO-CODE-HERE' });
  if(won) KIT.confetti(960,300,90,2.6); }   /* confetti only on a win */

addEventListener('keydown',function(e){ if(e.target&&e.target.tagName==='INPUT') return; keys[e.key.toLowerCase()]=true; if(/^Arrow| $/.test(e.key)) e.preventDefault(); });
addEventListener('keyup',function(e){ keys[e.key.toLowerCase()]=false; });
addEventListener('blur',function(){ keys={}; });

function pts(base){ return Math.round(base*RK.mult(S.streak)*(S.boost>0?2:1)); }
function step(dt){ if(!S||!S.started||S.over||RK.busy()||RK.fx.frozen()) return;   /* a window is up, or a hit-stop: nothing moves and the clock waits */
  gt+=dt; S.left-=dt; if(S.boost>0) S.boost=Math.max(0,S.boost-dt);
  if(!S.storm&&CFG.secs-S.left>=CFG.stormAt){ S.storm=1; RK.fx.banner('Rock storm!','watch the sky',{kind:'bad'}); }
  var dx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0); ship.x=Math.max(30,Math.min(W-30,ship.x+dx*((keys.x||keys.k)?620:340)*dt));
  if((spawnG-=dt)<=0){ spawnG=0.7; gems.push({x:40+Math.random()*(W-80),y:-20}); }
  if((spawnR-=dt)<=0){ spawnR=S.storm?0.5:1.25; rocks.push({x:40+Math.random()*(W-80),y:-30,v:150+Math.random()*120}); }
  var reach=34+S.magnet*26;
  gems=gems.filter(function(g){ g.y+=170*dt; if(Math.abs(g.x-ship.x)<reach&&Math.abs(g.y-470)<28){ var p=pts(CFG.gem); S.gems++; S.sinceDock++; S.score+=p; RK.fx.pop(g.x*2,g.y*2,'+'+p,p>CFG.gem?'gold':'good'); RK.snd('tick'); return false; } return g.y<H+30; });
  rocks=rocks.filter(function(r){ r.y+=r.v*dt; if(Math.abs(r.x-ship.x)<32&&Math.abs(r.y-470)<28){
      if(S.shield){ S.shield=0; RK.fx.pop(ship.x*2,900,'Blocked!','gold'); } else { S.hearts--; RK.fx.shake(0.55); RK.fx.stop(70); RK.fx.pop(ship.x*2,900,'−1','bad'); }
      return false; } return r.y<H+40; });
  if(S.hearts<=0){ if(!S.revived){ save(); card.open('revive'); } else endRun(); return; }
  if(S.left<=0){ endRun(); return; }
  if(S.sinceDock>=CFG.every){ save(); card.open('dock'); } }
function clock(s){ s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2); }
function draw(){ var c=$('dm-canvas').getContext('2d'); c.fillStyle=PAL.sky; c.fillRect(0,0,W,H);
  c.fillStyle=PAL.star; for(var i=0;i<40;i++){ var sx=(i*197)%W, sy=((i*113)+gt*30*(1+i%3))%H; c.fillRect(sx,sy,3,3); }
  if(!S||!S.started) return;
  gems.forEach(function(g){ c.fillStyle=PAL.ink; c.fillRect(g.x-13,g.y-13,26,26); c.fillStyle=PAL.gem; c.fillRect(g.x-9,g.y-9,18,18); });
  rocks.forEach(function(r){ c.fillStyle=PAL.ink; c.fillRect(r.x-20,r.y-20,40,40); c.fillStyle=PAL.rock; c.fillRect(r.x-16,r.y-16,32,32); });
  c.fillStyle=PAL.ink; c.fillRect(ship.x-26,452,52,40); c.fillRect(ship.x-10,436,20,20); c.fillStyle=PAL.ship; c.fillRect(ship.x-22,456,44,32); c.fillRect(ship.x-6,440,12,16);
  if(S.shield){ c.strokeStyle=PAL.gem; c.lineWidth=4; c.strokeRect(ship.x-32,430,64,68); }
  var m=RK.mult(S.streak), nx=RK.multNext(S.streak);
  hud.set({ hearts:S.hearts, time:clock(S.left), score:S.score, dock:{ f:S.sinceDock/CFG.every, text:S.boost>0?'×2 points '+Math.ceil(S.boost)+' s':(CFG.every-S.sinceDock)+' gems to go' },
    streak:m>1?S.streak+' right = ×'+m+' points':nx?nx.more+' more right for ×'+nx.mult:'' });
  hud.hide('streak',m<=1&&!nx); hud.flag('time','warn',S.left<=20); hud.flag('dock','hot',S.boost>0); hud.flag('streak','hot',m>1); }
function loop(ts){ var dt=last?Math.min(0.05,(ts-last)/1000):0; last=ts; step(dt); draw(); requestAnimationFrame(loop); }

/* a reload mid-run lands back in the run, on the same question or pick if one was open */
var saved=load(); if(saved){ S=saved; play(false); } else S=fresh('');
requestAnimationFrame(loop);

/* test hooks, the shape the Gameplay checks read. Hooks set the scene; real keys and clicks do the action. */
window.__G={ state:function(){ return S; }, results:RES, card:card, pick:pick, hud:hud, rk:RK, cfg:CFG, open:function(k){ return card.open(k||'dock'); }, end:endRun, step:step, ship:function(){ return ship; },
  gems:function(){ return gems; }, rocks:function(){ return rocks; }, showQ:function(){ return card.open('dock'); } };

/* <demo-only> ?still=title|hud|card|miss|pick|pause|end freezes one screen for a look test */
if(prm.still&&prm.still!=='title') addEventListener('load',function(){ setTimeout(function(){ var st=prm.still;
  S=fresh('Sam K'); S.started=true; S.score=12450; S.hearts=2; S.gems=31; S.sinceDock=4; S.streak=4; S.best=4; S.answered=9; S.correct=7; S.left=97; play(true);
  gems=[{x:300,y:150},{x:620,y:260},{x:780,y:90}]; rocks=[{x:200,y:320,v:0},{x:700,y:400,v:0}]; draw();
  step=function(){}; window.__G.step=step;
  if(st==='card'||st==='miss'){ card.open('dock'); if(st==='miss') setTimeout(function(){ var w=S.q.choices.findIndex(function(c){ return !c.ok; }); card.answer(w); },320); }
  else if(st==='pick'){ S.pick=null; pick.open(1,'Both right! Pick an upgrade.'); }
  else if(st==='pause') document.dispatchEvent(new KeyboardEvent('keydown',{key:'p',bubbles:true}));
  else if(st==='end'){ S.left=0; endRun(); }
  document.documentElement.setAttribute('data-still',st); },200); });
/* </demo-only> */
})();
</script>
</body>
</html>
