<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spitz Math</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@400;600;800&display=swap">
<style>
/* Launch pad for spitzmath.com: two doors, the Arcade (arcade/) and Checkpoint (checkpoint/). The walk-in board and warmup stay off this page. */
:root{
  --paper:#0E1016; --panel:#191C25; --line:#2E3344; --ink:#F3F5FA; --muted:#9AA3B8; --brand:#FFB020; --blue:#3D7BFF;
  --display:'Bungee', 'Arial Black', system-ui, sans-serif;
  --body:'Lexend', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{ background:var(--paper); color:var(--ink); margin:0; }
body{ font:400 16px/1.5 var(--body); padding:0 16px 48px; min-height:100vh; box-sizing:border-box; display:flex; flex-direction:column; }
.wrap{ width:100%; max-width:980px; margin:0 auto; flex:1; display:flex; flex-direction:column; justify-content:center; gap:36px; padding-top:40px; }
header{ text-align:center; }
.tag{ font:600 14px/1 var(--body); color:var(--muted); letter-spacing:.14em; text-transform:uppercase; }
h1{ font:400 clamp(40px,8vw,76px)/1 var(--display); margin:10px 0 0; }
h1 span{ color:var(--brand); }
.sub{ color:var(--muted); margin:14px 0 0; font-size:18px; }
.doors{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; }
.door{ --acc:var(--brand); display:flex; flex-direction:column; gap:14px; padding:28px; border-radius:24px; text-decoration:none; color:var(--ink);
  background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 18%,var(--panel)),var(--panel) 70%);
  border:3px solid color-mix(in srgb,var(--acc) 30%,var(--line)); transition:transform .15s, border-color .15s, box-shadow .15s; }
.door.cp{ --acc:var(--blue); }
.door:hover,.door:focus-visible{ transform:translateY(-3px); border-color:var(--acc); box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 30%,transparent), 0 14px 36px color-mix(in srgb,var(--acc) 22%,transparent); outline:none; }
.icon{ font-size:64px; line-height:1; }
.door b{ font:400 clamp(30px,4.5vw,42px)/1 var(--display); color:var(--acc); }
.door p{ margin:0; color:var(--muted); font-size:17px; }
.go{ margin-top:auto; align-self:flex-start; font:400 20px/1 var(--display); background:var(--acc); color:var(--paper); padding:14px 24px; border-radius:14px; }
.door.cp .go{ color:#fff; }
@media (prefers-reduced-motion:reduce){ .door{ transition:none; } .door:hover,.door:focus-visible{ transform:none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="tag">Made by Spitz 🍔</div>
    <h1>Spitz <span>Math</span></h1>
    <p class="sub">Where do you want to go?</p>
  </header>
  <nav class="doors">
    <a class="door" href="arcade/">
      <span class="icon" aria-hidden="true">🕹️</span>
      <b>Arcade</b>
      <p>Play math games and climb the leaderboard.</p>
      <span class="go">Play →</span>
    </a>
    <a class="door cp" href="checkpoint/">
      <span class="icon" aria-hidden="true">📝</span>
      <b>Checkpoint</b>
      <p>Take a practice test and see how you’re doing.</p>
      <span class="go">Start →</span>
    </a>
  </nav>
</div>
</body>
</html>
