<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spitz Math</title>
<meta name="description" content="Math games and practice tests from Mr. Spitz. Pick the Arcade or Checkpoint.">
<!-- link preview card (Google Classroom, email, texts) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Spitz Math">
<meta property="og:title" content="Spitz Math">
<meta property="og:description" content="Math games and practice tests from Mr. Spitz. Pick the Arcade or Checkpoint.">
<meta property="og:url" content="https://spitzmath.com/">
<meta property="og:image" content="https://spitzmath.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&family=Nunito:wght@600;800&display=swap">
<style>
/* Launch pad for spitzmath.com, neon arcade. Title on top, burger + starburst in the middle, Arcade door on the left, Checkpoint door on the right.
   Walk-in board and warmup stay off this page. No flashing: every motion is a slow bob, pulse or glow. */
:root{
  color-scheme:dark;
  --bg:#06081a; --bg2:#02030c; --fg:#eaf6ff; --fg-dim:rgba(234,246,255,.6);
  --pink:#ff2bd6; --cyan:#21e6ff; --yellow:#ffe13a; --orange:#ff7a1a;
  --display:'Bungee',Impact,sans-serif;
  --pixel:'Press Start 2P',monospace;
  --body:'Nunito',system-ui,sans-serif;
  --ms:3600ms;
  --hero:min(440px,62vh,40vw);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--fg);font-family:var(--body);min-height:100%;position:relative;overflow-x:hidden;
  background:linear-gradient(180deg,#0a0f33 0%,var(--bg) 45%,var(--bg2) 100%) var(--bg);
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}

/* scanlines, floor grid, stars */
.bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px),radial-gradient(ellipse at 50% 120%,rgba(33,230,255,.16),transparent 55%)}
.bgfx::after{content:"";position:absolute;left:-20%;right:-20%;bottom:0;height:38%;
  background:repeating-linear-gradient(90deg,rgba(255,43,214,.28) 0 2px,transparent 2px 70px),repeating-linear-gradient(180deg,rgba(33,230,255,.28) 0 2px,transparent 2px 46px);
  transform:perspective(500px) rotateX(62deg);transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 60%);mask-image:linear-gradient(180deg,transparent,#000 60%)}
.star{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.5;pointer-events:none;z-index:0;animation:twinkle 2.6s ease-in-out infinite}

main{position:relative;z-index:1;max-width:1240px;margin:0 auto;min-height:100%;
  display:grid;grid-template-columns:minmax(0,1fr) var(--hero) minmax(0,1fr);grid-template-rows:auto 1fr auto;
  align-items:center;column-gap:clamp(16px,3vw,48px);row-gap:6px;padding-block:clamp(12px,2.4vh,26px) 14px}

/* title */
.title{grid-column:1/-1;justify-self:center;font-family:var(--display);font-weight:400;margin:0;text-align:center;line-height:1.05;padding:.04em .12em;
  font-size:clamp(40px,min(7.6vw,13vh),96px);letter-spacing:.06em;text-transform:uppercase;
  color:var(--yellow);background:linear-gradient(180deg,#fff27a 0%,var(--yellow) 22%,#ff9d14 48%,#ff7a1a 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  -webkit-text-stroke:.07em #140800;paint-order:stroke fill;
  filter:drop-shadow(.05em .06em 0 #140800) drop-shadow(0 0 4px #fff7b0) drop-shadow(0 0 12px #ffb21f) drop-shadow(0 0 30px rgba(255,122,26,.9));
  animation:sway var(--ms) ease-in-out infinite;will-change:transform}

/* burger + starburst */
.hero{grid-column:2;grid-row:2;position:relative;width:var(--hero);aspect-ratio:1312/1199;justify-self:center}
.hero img{position:absolute;inset:0;width:100%;height:100%;display:block;will-change:transform}
.hero .burst{animation:burst calc(var(--ms)*1.25) ease-in-out infinite;transform-origin:50% 50%;
  filter:drop-shadow(0 0 4px #fff7b0) drop-shadow(0 0 14px var(--yellow)) drop-shadow(0 0 30px rgba(255,122,26,.7))}
.hero .patty{animation:bob var(--ms) ease-in-out infinite;animation-delay:-700ms;transform-origin:50% 60%;filter:drop-shadow(0 14px 16px rgba(0,0,0,.5))}
.hero .halo{position:absolute;inset:4%;border-radius:50%;background:radial-gradient(circle,var(--yellow) 0%,var(--orange) 30%,transparent 65%);opacity:.22;filter:blur(26px);animation:halo var(--ms) ease-in-out infinite}
.coin{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);font-family:var(--pixel);font-size:clamp(9px,1vw,12px);color:var(--yellow);text-shadow:0 0 8px var(--yellow);white-space:nowrap;animation:pulse 2.4s ease-in-out infinite}
body:has(.door.a:hover,.door.a:focus-visible) .patty{translate:-10px 0;rotate:-6deg}
body:has(.door.b:hover,.door.b:focus-visible) .patty{translate:10px 0;rotate:6deg}
.hero .patty{transition:translate .3s ease,rotate .3s ease}

/* doors, one on each side */
.door{--c:var(--pink);grid-row:2;position:relative;display:grid;justify-items:center;text-align:center;gap:8px;text-decoration:none;color:var(--fg);min-width:0;width:100%;max-width:380px;
  padding:clamp(18px,2.4vw,30px) clamp(14px,2vw,26px);border-radius:18px;border:3px solid var(--c);background:rgba(4,6,28,.72);
  container-type:inline-size;box-shadow:0 0 12px var(--c),inset 0 0 26px color-mix(in srgb,var(--c) 28%,transparent);transition:transform .25s cubic-bezier(.3,1.4,.5,1),box-shadow .25s}
.door.a{grid-column:1;justify-self:end}
.door.b{--c:var(--cyan);grid-column:3;justify-self:start}
.door:hover,.door:focus-visible{transform:translateY(-4px) scale(1.02);outline:none;
  box-shadow:0 0 22px var(--c),0 0 50px color-mix(in srgb,var(--c) 50%,transparent),inset 0 0 26px color-mix(in srgb,var(--c) 40%,transparent)}
.door:focus-visible{outline:3px solid #fff;outline-offset:4px}
.door h2{font-family:var(--display);font-weight:400;margin:0;line-height:.95;text-transform:uppercase;letter-spacing:.04em;font-size:min(54px,10cqi);color:#fff;text-shadow:0 0 8px var(--c),0 0 22px var(--c)}
.door p{margin:4px 0 10px;font-family:var(--pixel);font-size:min(12px,3.6cqi);line-height:1.6;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;color:var(--c);text-shadow:0 0 8px var(--c)}
.btn{font-family:var(--pixel);font-size:clamp(10px,1vw,13px);letter-spacing:.06em;text-transform:uppercase;background:var(--c);color:var(--bg);padding:12px 18px;border-radius:8px;border:2px solid #fff;
  box-shadow:0 0 10px var(--c),0 0 24px var(--c);animation:pulse 2.4s ease-in-out infinite}
.door.b .btn{animation-delay:-1.2s}
.door:hover .btn,.door:focus-visible .btn{animation:none}

footer{grid-column:1/-1;justify-self:center;display:flex;align-items:center}
.made{font-family:var(--display);font-size:12px;letter-spacing:.1em;background:#fff;color:var(--bg);padding:5px 12px;border-radius:6px;box-shadow:0 0 10px #fff}

@keyframes sway{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
@keyframes burst{0%,100%{transform:scale(.95) rotate(-4deg)}50%{transform:scale(1.05) rotate(4deg)}}
@keyframes halo{0%,100%{transform:scale(.9);opacity:.16}50%{transform:scale(1.1);opacity:.3}}
@keyframes pulse{50%{box-shadow:0 0 4px var(--c),0 0 10px var(--c);opacity:.8}}
@keyframes twinkle{50%{opacity:.1}}
/* Reduced motion: keep it moving, but slower and smaller */
@media (prefers-reduced-motion:reduce){:root{--ms:7000ms}.star{animation:none}.door{transition:none}}

/* phones and narrow windows: stack the doors under the burger */
@media (max-width:760px){
  :root{--hero:min(340px,82vw)}
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;row-gap:16px;align-content:start}
  .hero,.door.a,.door.b{grid-column:1;grid-row:auto;justify-self:center}
  .door{max-width:440px}
  .door h2{font-size:clamp(34px,10vw,48px)}
}
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true"></div>
<span class="star" style="left:8%;top:12%"></span><span class="star" style="left:22%;top:30%;animation-delay:.7s"></span><span class="star" style="left:88%;top:18%;animation-delay:1.3s"></span><span class="star" style="left:76%;top:40%;animation-delay:.3s"></span><span class="star" style="left:14%;top:55%;animation-delay:1.9s"></span><span class="star" style="left:93%;top:52%;animation-delay:1.1s"></span><span class="star" style="left:40%;top:8%;animation-delay:2.2s"></span><span class="star" style="left:62%;top:6%;animation-delay:.5s"></span>

<main>
  <h1 class="title">Spitz Math</h1>

  <a class="door a" href="arcade/">
    <h2>Arcade</h2>
    <p>Play · Score · Win</p>
    <span class="btn">Press Start</span>
  </a>

  <div class="hero" aria-hidden="true">
    <div class="halo"></div>
    <img class="burst" src="launchpad_burst.webp" alt="" width="1312" height="1199">
    <img class="patty" src="launchpad_patty.webp" alt="" width="1312" height="1199">
    <div class="coin">▶ INSERT COIN</div>
  </div>

  <a class="door b" href="checkpoint/">
    <h2>Checkpoint</h2>
    <p>Practice · Test · Pass</p>
    <span class="btn">Press Start</span>
  </a>

  <footer><span class="made">MADE BY SPITZ 🍔</span></footer>
</main>
</body>
</html>
